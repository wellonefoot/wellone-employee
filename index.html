<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Wellone Sales Staff</title>
<link href="https://wnavzhrkwgnegjdetdno.supabase.co" rel="preconnect"/>
<link href="css/admin.css?v=107" rel="stylesheet"/>
<link href="assets/favicon/favicon.ico" rel="icon"/>
<link href="manifest.webmanifest" rel="manifest"/>
<link href="assets/favicon/apple-icon-180x180.png" rel="apple-touch-icon"/>
<meta content="#f5fff4" name="theme-color"/>
<link crossorigin="" href="https://cdn.jsdelivr.net" rel="preconnect"/>
</head>
<body class="employee-page-body">
<section class="employee-login-screen" id="employeeLoginScreen">
<form class="employee-login-card" id="employeeLoginForm">
<img alt="Wellone" src="assets/logo.png?v=107"/>
<p class="tag">sales stock desk</p>
<h1>Sales Staff Login</h1>
<p>Use a Sales Staff ID created by the admin.</p>
<label>Username<input autocomplete="username" id="employeeLoginUsername" placeholder="Username" required=""/></label>
<label>Password<input autocomplete="current-password" id="employeeLoginPassword" placeholder="Password" required="" type="password"/></label>
<button type="submit">Login</button>
<p class="login-error" id="employeeLoginError"></p>
</form>
</section>
<main class="employee-desk" hidden="" id="employeeDesk">
<header class="employee-topbar">
<a class="employee-brand" href="index.html"><img alt="Wellone" src="assets/logo.png?v=107"/></a>
<div><small>Signed in as</small><b id="employeeSessionName">Employee</b></div>
<button id="employeeLogoutBtn" type="button">Logout</button>
</header>

<section class="employee-mode-view active" id="employeeSaleView">
<section class="employee-work-card">
<div class="employee-work-title"><p class="tag">stock sale</p><h1>Find a product</h1><p>Search by product name or barcode, choose the exact available colour and option, then record the sold quantity.</p></div>
<form class="employee-barcode-form" id="employeeBarcodeForm">
<input autocomplete="off" id="employeeBarcodeInput" inputmode="search" placeholder="Product name or barcode" required=""/>
<button type="submit">Search</button>
</form>
<div class="employee-status" id="employeeStatus">Ready.</div>
<div class="employee-product-result" id="employeeProductResult"></div>
</section>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/employee.bundle.js?v=107"></script>

<script src="js/pwa-install.js?v=107"></script>
</body>
</html>
